name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint
        run: uv run poe lint

      - name: Tests
        run: uv run poe test

      - name: dbt parse (no warehouse connection)
        run: uv run poe dbt-parse

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build serving image
        run: docker build -t app:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name app -p 8000:8000 app:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
