# dbt project: ELT on BigQuery (ADR 0005).
# Run from the project root:  uv run poe dbt-build
name: mta_abtest_engine
version: "1.0.0"
profile: mta_abtest_engine

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# One dataset per layer: <target dataset>_<layer>, e.g. mta_staging.
models:
  mta_abtest_engine:
    staging:
      +schema: staging
      +materialized: view

flags:
  send_anonymous_usage_stats: false
