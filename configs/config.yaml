# Pipeline configuration (versioned). Validated by `config.ProjectConfig`.
# Environment-specific values (paths to models, tracking URIs, secrets)
# live in environment variables / .env instead (see .env.example).

random_seed: 42

data:
  raw_path: data/raw/dataset.csv
  validated_path: data/interim/validated.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
  test_size: 0.2
  n_samples: 5000          # only used by the synthetic example ingest
  # Journey marts extracted from BigQuery (ADR 0008)
  touchpoints_path: data/raw/fct_touchpoints.parquet
  journeys_path: data/raw/fct_user_journeys.parquet

journey:
  # Label = purchase within horizon_days of the first touchpoint (ADR 0009).
  # Touchpoints after the horizon are dropped (future relative to the label).
  horizon_days: 14
  test_start: 2021-01-01     # journeys starting from here are the test set
  data_end: 2021-02-01       # exclusive end of the available data

model:
  name: logistic_regression   # options: logistic_regression, random_forest
  params:
    C: 1.0
    max_iter: 1000

evaluation:
  min_roc_auc: 0.75           # quality gate: below this, the pipeline fails
  metrics_path: reports/metrics.json

propensity:
  # Session propensity model (ADR 0010-0012)
  experiment_name: session-propensity
  report_path: reports/propensity_metrics.csv
  bootstrap_samples: 200     # user-level resamples for 95% intervals
  reference_model: funnel_rule   # the gate compares ML candidates against it
  logistic:
    C: 1.0
    max_iter: 2000
  gbm:
    learning_rate: 0.05
    max_iter: 300
    max_leaf_nodes: 15
    min_samples_leaf: 100
    l2_regularization: 1.0
    early_stopping: true       # stops on a validation split taken from train

tuning:
  # Optuna search for the GBM (ADR 0013). January (test) is never used here:
  # sub-train = scoring points whose label window ends before validation_start,
  # validation = points from validation_start whose window ends before test_start.
  study_name: gbm-tuning
  storage: sqlite:///optuna.db   # resumable study (git-ignored)
  validation_start: 2020-12-01
  n_trials: 40
  timeout_seconds: 1800
  pruning_step: 50               # evaluate every 50 boosting iterations
  fixed:
    early_stopping: false        # validation is temporal, not a random split
  search_space:
    learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
    max_iter: {type: int, low: 100, high: 600}
    max_leaf_nodes: {type: int, low: 7, high: 63}
    min_samples_leaf: {type: int, low: 20, high: 500, log: true}
    l2_regularization: {type: float, low: 0.001, high: 10.0, log: true}

tracking:
  experiment_name: mta-abtest-engine

bigquery:
  # Same location as the GA4 public dataset: BigQuery cannot join across regions.
  location: US
  source_table: bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*
  marts_dataset: mta_marts   # built by dbt: <profile dataset>_marts
  # Cost guard (ADR 0003/0005): 5 GiB. The whole sample is 3.34 GiB, so a
  # legitimate query never needs more.
  maximum_bytes_billed: 5368709120
