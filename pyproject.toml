[project]
name = "mta-abtest-engine"
version = "0.1.0"
description = "User-level multi-touch attribution and journey optimization"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Duvan Fruto" }]
license = "MIT"
# Core dependencies: what the package needs to run in ANY context
# (training and serving). Keep this list small: it ends up in the Docker image.
dependencies = [
    "joblib>=1.4",
    "loguru>=0.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera>=0.24",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.scripts]
mta-abtest-engine = "mta_abtest_engine.pipelines.run:main"

# Dependency groups (PEP 735): installed locally, excluded from the production
# image unless explicitly requested (see Dockerfile).
[dependency-groups]
dev = [
    "httpx2>=2.0",  # used by FastAPI's TestClient
    "poethepoet>=0.29",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
training = [
    "mlflow>=3.0",
    "optuna>=4.0",
]
dbt = [
    "dbt-bigquery>=1.9",
]
# Extraction of the dbt marts from BigQuery to local Parquet (not in serving).
warehouse = [
    "db-dtypes>=1.3",
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.27",  # fast downloads (Storage Read API)
    "pyarrow>=17.0",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbstripout>=0.8",
    "seaborn>=0.13",
]

[tool.uv]
# `uv sync` installs every group locally; the Dockerfile installs only `serving`.
default-groups = [
    "dev",
    "serving",
    "training",
    "dbt",
    "warehouse",
    "notebooks",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mta_abtest_engine"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# SIM: simplifications, N: naming
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
# ML convention: capital `X` for feature matrices is allowed.
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --cov=mta_abtest_engine --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: slower tests that exercise several components together",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/mta_abtest_engine"]
omit = ["*/__main__.py"]

# ---------------------------------------------------------------------------
# Task runner (Poe the Poet): the SAME commands run locally and in CI.
# Usage: uv run poe <task>    |   list tasks: uv run poe
# ---------------------------------------------------------------------------
[tool.poe.tasks.lint]
help = "Static checks: ruff lint + format check"
sequence = ["ruff check .", "ruff format --check ."]
default_item_type = "cmd"

[tool.poe.tasks.format]
help = "Auto-format and auto-fix lint issues"
sequence = ["ruff format .", "ruff check --fix ."]
default_item_type = "cmd"

[tool.poe.tasks.test]
help = "Run the test suite with coverage"
cmd = "pytest"

[tool.poe.tasks.check]
help = "Everything CI runs: lint + tests + dbt parse"
sequence = ["lint", "test", "dbt-parse"]

[tool.poe.tasks.extract]
help = "Download the dbt marts from BigQuery, validate them, save Parquet (needs .env + ADC)"
cmd = "python -m mta_abtest_engine.data.extract"
envfile = ".env"

[tool.poe.tasks.dbt-parse]
help = "Validate dbt project and SQL references (no BigQuery connection)"
cmd = "dbt parse --project-dir dbt --profiles-dir dbt"
# Parsing never connects, so any project id works (CI has no .env).
env = { APP_GCP_PROJECT_ID = "parse-only" }

[tool.poe.tasks.dbt-show]
help = "Run a model or analysis on BigQuery and print rows: poe dbt-show -s <name>"
cmd = "dbt show --project-dir dbt --profiles-dir dbt --limit 100"
envfile = ".env"

[tool.poe.tasks.dbt-build]
help = "Build dbt models and run data tests on BigQuery (needs .env + ADC)"
cmd = "dbt build --project-dir dbt --profiles-dir dbt"
envfile = ".env"

[tool.poe.tasks.pipeline]
help = "Run the full pipeline: ingest -> validate -> features -> train -> evaluate"
cmd = "python -m mta_abtest_engine.pipelines.run --stage all"

[tool.poe.tasks.propensity]
help = "Session propensity: fit baselines/models, evaluate on test, log to MLflow"
cmd = "python -m mta_abtest_engine.pipelines.propensity"

[tool.poe.tasks.tune]
help = "Optuna tuning of the GBM on a temporal validation inside train (ADR 0013)"
cmd = "python -m mta_abtest_engine.training.tuning"

[tool.poe.tasks.serve]
help = "Run the prediction API locally with auto-reload"
cmd = "uvicorn mta_abtest_engine.serving.app:app --reload --port 8000"

[tool.poe.tasks.mlflow-ui]
help = "Open the MLflow UI (experiments, runs, models)"
cmd = "mlflow ui --backend-store-uri sqlite:///mlflow.db --port 5000"

[tool.poe.tasks.docker-build]
help = "Build the serving image"
cmd = "docker build -t mta-abtest-engine:dev ."

[tool.poe.tasks.docker-run]
help = "Run the serving image (mounts ./models)"
cmd = "docker run --rm -p 8000:8000 -v ./models:/app/models mta-abtest-engine:dev"
